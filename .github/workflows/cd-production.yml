name: Deploy - HostArmada Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostarmada-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy frontend and backend
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: torult1.hostarmada.net
      SSH_PORT: "19199"
      SSH_USER: dulanpro
      APP_ROOT: /home/dulanpro/repositories/whatsapp-finance-assistant

    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.salligo.com/api
        run: |
          npm ci
          npm run build
          mkdir -p .next/standalone/.next/static .next/standalone/public
          cp -a .next/static/. .next/standalone/.next/static/
          cp -a public/. .next/standalone/public/

      - name: Package frontend
        run: tar -czf frontend-standalone.tar.gz -C frontend/.next standalone

      - name: Configure SSH
        env:
          HOSTARMADA_SSH_KEY: ${{ secrets.HOSTARMADA_SSH_KEY }}
        run: |
          test -n "$HOSTARMADA_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HOSTARMADA_SSH_KEY" > ~/.ssh/hostarmada
          chmod 600 ~/.ssh/hostarmada
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload frontend build
        run: |
          scp -P "$SSH_PORT" -i ~/.ssh/hostarmada \
            frontend-standalone.tar.gz \
            "$SSH_USER@$SSH_HOST:/home/dulanpro/frontend-standalone.tar.gz"

      - name: Deploy on HostArmada
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/hostarmada "$SSH_USER@$SSH_HOST" \
            "APP_ROOT='$APP_ROOT' bash -s" <<'REMOTE'
          # HostArmada's generated Node activation script reads optional
          # variables that may be unset, so nounset (-u) cannot be enabled.
          set -eo pipefail

          cd "$APP_ROOT"
          git fetch origin main
          git merge --ff-only origin/main

          BACKEND="$APP_ROOT/backend"
          source "/home/dulanpro/nodevenv/repositories/whatsapp-finance-assistant/backend/22/bin/activate"
          cd "$BACKEND"
          npm ci --include=dev
          npm run build
          mkdir -p tmp
          touch tmp/restart.txt
          /usr/sbin/cloudlinux-selector stop --json --interpreter nodejs \
            --user dulanpro \
            --app-root repositories/whatsapp-finance-assistant/backend
          /usr/sbin/cloudlinux-selector start --json --interpreter nodejs \
            --user dulanpro \
            --app-root repositories/whatsapp-finance-assistant/backend
          deactivate || true

          FRONTEND="$APP_ROOT/frontend"
          STAGING="$FRONTEND/.next.deploy-new"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          tar -xzf /home/dulanpro/frontend-standalone.tar.gz -C "$STAGING"

          # Retain old hashed assets so already-cached pages keep working.
          if [[ -d "$FRONTEND/.next/standalone/.next/static" ]]; then
            mkdir -p "$STAGING/standalone/.next/static"
            cp -an "$FRONTEND/.next/standalone/.next/static/." \
              "$STAGING/standalone/.next/static/"
          fi

          # Stop Passenger before replacing the directory used by its running
          # process. This prevents a process from continuing in a deleted build.
          /usr/sbin/cloudlinux-selector stop --json --interpreter nodejs \
            --user dulanpro \
            --app-root repositories/whatsapp-finance-assistant/frontend

          rm -rf "$FRONTEND/.next/standalone.previous"
          if [[ -d "$FRONTEND/.next/standalone" ]]; then
            mv "$FRONTEND/.next/standalone" "$FRONTEND/.next/standalone.previous"
          fi
          mv "$STAGING/standalone" "$FRONTEND/.next/standalone"
          rmdir "$STAGING"
          rm -f /home/dulanpro/frontend-standalone.tar.gz
          mkdir -p "$FRONTEND/tmp"
          touch "$FRONTEND/tmp/restart.txt"
          /usr/sbin/cloudlinux-selector start --json --interpreter nodejs \
            --user dulanpro \
            --app-root repositories/whatsapp-finance-assistant/frontend
          REMOTE

      - name: Verify production
        run: |
          for attempt in {1..12}; do
            frontend_status=$(curl -sS -o /dev/null -w '%{http_code}' https://salligo.com/login || true)
            backend_status=$(curl -sS -o /dev/null -w '%{http_code}' https://api.salligo.com/api/health/live || true)
            if [[ "$frontend_status" == "200" && "$backend_status" == "200" ]]; then
              echo "Deployment verified: frontend=$frontend_status backend=$backend_status"
              exit 0
            fi
            echo "Waiting for restart: frontend=$frontend_status backend=$backend_status"
            sleep 5
          done
          echo "Production verification failed"
          exit 1
